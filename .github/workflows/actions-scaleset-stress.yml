name: actions-scaleset-stress

on:
  pull_request:
    paths:
      - "actions-scaleset-stress/**"
      - "actions-scaleset-stress.sh"
      - ".github/workflows/actions-scaleset-stress.yml"
  push:
    branches: [main]
    tags: ["v*", "actions-scaleset-stress/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: actions-scaleset-stress

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: actions-scaleset-stress/go.mod
          cache-dependency-path: actions-scaleset-stress/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: actions-scaleset-stress/go.mod
          cache-dependency-path: actions-scaleset-stress/go.sum
      - name: Build release binaries
        run: |
          case "$GITHUB_REF" in
            refs/tags/actions-scaleset-stress/v*) version="${GITHUB_REF#refs/tags/actions-scaleset-stress/}" ;;
            refs/tags/v*) version="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/main) version="edge-${GITHUB_SHA::7}" ;;
            *) version="dev-${GITHUB_SHA::7}" ;;
          esac
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="$RUNNER_TEMP/build/$os/$arch"
              mkdir -p "$out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$version" -o "$out/actions-scaleset-stress" .
              tar -C "$out" -czf "$dist/actions-scaleset-stress_${version}_${os}_${arch}.tar.gz" actions-scaleset-stress
            done
          done
          (cd "$dist" && sha256sum ./*.tar.gz > checksums.txt)
          got=$("$RUNNER_TEMP/build/linux/amd64/actions-scaleset-stress" version)
          [[ "$got" == "actions-scaleset-stress $version" ]] || { echo "::error::version printed '$got'"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: actions-scaleset-stress-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#actions-scaleset-stress/}"
          args=(--verify-tag --title "actions-scaleset-stress $version" --generate-notes)
          prev=$(gh release list --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("actions-scaleset-stress/v") or startswith("v"))][0] // empty')
          if [[ -n "$prev" ]]; then args+=(--notes-start-tag "$prev"); fi
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" dist/* "${args[@]}"
      - name: Replace edge prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          tag=actions-scaleset-stress/edge
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "actions-scaleset-stress edge (${GITHUB_SHA::7})" \
            --notes "Rolling Linux and Darwin build of main at $GITHUB_SHA. Replaced on every push to main."
